<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calliar - Génération de trajectoire par KNN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 10px; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.8); margin-bottom: 30px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .upload-area { border: 3px dashed #1a2a6c; border-radius: 20px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: #f8f9fa; }
        .upload-area:hover { border-color: #b21f1f; background: #e9ecef; }
        .preview-container { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
        .preview-box { flex: 1; text-align: center; }
        .preview-box h3 { margin-bottom: 15px; color: #1a2a6c; }
        .preview-image { max-width: 100%; max-height: 200px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        canvas { width: 100%; max-width: 400px; border: 1px solid #ddd; border-radius: 10px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: linear-gradient(135deg, #1a2a6c, #b21f1f); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; cursor: pointer; margin-top: 20px; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #1a2a6c; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-info { margin-top: 20px; padding: 15px; background: #d4edda; border-radius: 10px; border-left: 4px solid #28a745; }
        .result-info.error { background: #f8d7da; border-left-color: #dc3545; }

        /* ── Animation de dessin ── */
        #animBtn { background: linear-gradient(135deg, #28a745, #1a2a6c); margin-left: 10px; }
        .debug-info { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Calliar - KNN Trajectory</h1>
        <div class="subtitle">Recherche par similarité (voisin le plus proche)</div>
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <p>📸 Cliquez ou glissez une image ici</p>
                <p style="font-size: 12px; color: #666;">PNG, JPG, JPEG</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>
            <div style="text-align: center;">
                <button id="predictBtn" disabled>🎯 Générer la trajectoire</button>
                <button id="animBtn" disabled>▶️ Animer</button>
            </div>
            <div class="preview-container" id="previewContainer" style="display: none;">
                <div class="preview-box">
                    <h3>📷 Image</h3>
                    <img id="previewImage" class="preview-image" alt="Aperçu">
                </div>
                <div class="preview-box">
                    <h3>✍️ Trajectoire</h3>
                    <canvas id="trajectoryCanvas" width="400" height="400"></canvas>
                    <div class="debug-info" id="debugInfo"></div>
                </div>
            </div>
            <div id="resultDiv" style="display: none;"></div>
        </div>
    </div>

    <script>
        const uploadArea   = document.getElementById('uploadArea');
        const fileInput    = document.getElementById('fileInput');
        const predictBtn   = document.getElementById('predictBtn');
        const animBtn      = document.getElementById('animBtn');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const trajectoryCanvas = document.getElementById('trajectoryCanvas');
        const resultDiv    = document.getElementById('resultDiv');
        const debugInfo    = document.getElementById('debugInfo');
        let currentImageData = null;
        let lastStrokes = null;

        uploadArea.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { if (e.target.files.length) handleImage(e.target.files[0]); };
        uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#28a745'; };
        uploadArea.ondragleave = () => { uploadArea.style.borderColor = '#1a2a6c'; };
        uploadArea.ondrop = (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#1a2a6c';
            if (e.dataTransfer.files.length) handleImage(e.dataTransfer.files[0]);
        };

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageData = e.target.result;
                previewImage.src = currentImageData;
                previewContainer.style.display = 'flex';
                predictBtn.disabled = false;
                animBtn.disabled = true;
                resultDiv.style.display = 'none';
                const ctx = trajectoryCanvas.getContext('2d');
                ctx.clearRect(0, 0, trajectoryCanvas.width, trajectoryCanvas.height);
                ctx.fillStyle = '#bbb';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('En attente de génération...', 200, 200);
            };
            reader.readAsDataURL(file);
        }

        predictBtn.onclick = async () => {
            if (!currentImageData) return;
            predictBtn.disabled = true;
            animBtn.disabled = true;
            predictBtn.innerHTML = '🔄 Génération... <span class="loader"></span>';
            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: currentImageData })
                });
                const data = await res.json();
                if (res.ok) {
                    lastStrokes = data.strokes;
                    drawTrajectory(data.strokes);
                    animBtn.disabled = false;
                    resultDiv.innerHTML = `<div class="result-info">
                        ✅ <strong>Résultat</strong><br>
                        📝 Mot trouvé: <strong>${data.best_match || '?'}</strong><br>
                        🎯 Confiance: ${(data.confidence * 100).toFixed(1)}%<br>
                        ⏱️ Temps: ${data.time}s
                    </div>`;
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.innerHTML = `<div class="result-info error">❌ Erreur: ${data.error}</div>`;
                    resultDiv.style.display = 'block';
                }
            } catch(err) {
                resultDiv.innerHTML = `<div class="result-info error">❌ Erreur réseau: ${err.message}</div>`;
                resultDiv.style.display = 'block';
            } finally {
                predictBtn.disabled = false;
                predictBtn.innerHTML = '🎯 Générer la trajectoire';
            }
        };

        animBtn.onclick = () => {
            if (lastStrokes) animateTrajectory(lastStrokes);
        };

        // ============================================================
        // FONCTIONS DE DESSIN CORRIGÉES
        // ============================================================

        /**
         * Normalise les strokes pour s'assurer que toutes les coordonnées
         * sont dans [0,1] — correction côté client en cas de problème serveur.
         */
        function normalizeStrokes(strokes) {
            let xMin = Infinity, xMax = -Infinity;
            let yMin = Infinity, yMax = -Infinity;

            for (const stroke of strokes) {
                for (const pt of stroke) {
                    if (pt[0] < xMin) xMin = pt[0];
                    if (pt[0] > xMax) xMax = pt[0];
                    if (pt[1] < yMin) yMin = pt[1];
                    if (pt[1] > yMax) yMax = pt[1];
                }
            }

            const xRange = xMax - xMin || 1;
            const yRange = yMax - yMin || 1;
            const scale  = Math.max(xRange, yRange);

            // Si déjà dans [0,1] avec marge, on ne touche à rien
            if (xMin >= -0.01 && xMax <= 1.01 && yMin >= -0.01 && yMax <= 1.01) {
                debugInfo.textContent = `✅ Coords OK [${xMin.toFixed(2)}, ${xMax.toFixed(2)}] × [${yMin.toFixed(2)}, ${yMax.toFixed(2)}]`;
                return strokes;
            }

            debugInfo.textContent = `⚠️ Renorm. depuis [${xMin.toFixed(1)},${xMax.toFixed(1)}]×[${yMin.toFixed(1)},${yMax.toFixed(1)}]`;

            return strokes.map(stroke =>
                stroke.map(pt => [
                    (pt[0] - xMin) / scale * 0.9 + 0.05,
                    (pt[1] - yMin) / scale * 0.9 + 0.05
                ])
            );
        }

        function strokeToCanvas(pt, w, h) {
            // Axe Y : les données calligraphiques ont souvent Y croissant vers le bas
            // On essaie d'abord sans inversion, si le résultat est bizarre on peut changer
            return [pt[0] * w, pt[1] * h];
        }

        function drawTrajectory(strokes) {
            const canvas = trajectoryCanvas;
            const ctx    = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            if (!strokes || strokes.length === 0) {
                ctx.fillStyle = '#999';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Aucune trajectoire', w / 2, h / 2);
                return;
            }

            // Normalisation défensive côté client
            const normStrokes = normalizeStrokes(strokes);

            const palette = ['#1a2a6c', '#b21f1f', '#f0900a', '#28a745', '#9b27af', '#0097a7'];

            for (let s = 0; s < normStrokes.length; s++) {
                const stroke = normStrokes[s];
                if (stroke.length < 2) {
                    // Point isolé → petit cercle
                    const [cx, cy] = strokeToCanvas(stroke[0], w, h);
                    ctx.beginPath();
                    ctx.arc(cx, cy, 2, 0, 2 * Math.PI);
                    ctx.fillStyle = palette[s % palette.length];
                    ctx.fill();
                    continue;
                }

                ctx.beginPath();
                const [sx, sy] = strokeToCanvas(stroke[0], w, h);
                ctx.moveTo(sx, sy);

                for (let i = 1; i < stroke.length; i++) {
                    const [px, py] = strokeToCanvas(stroke[i], w, h);
                    ctx.lineTo(px, py);
                }

                ctx.strokeStyle = palette[s % palette.length];
                ctx.lineWidth   = 2.5;
                ctx.lineJoin    = 'round';
                ctx.lineCap     = 'round';
                ctx.stroke();
            }

            // Marqueur début (vert)
            const firstStroke = normStrokes[0];
            if (firstStroke && firstStroke.length > 0) {
                const [bx, by] = strokeToCanvas(firstStroke[0], w, h);
                drawMarker(ctx, bx, by, '#28a745', 'Début');
            }

            // Marqueur fin (rouge)
            const lastStroke = normStrokes[normStrokes.length - 1];
            if (lastStroke && lastStroke.length > 0) {
                const lastPt = lastStroke[lastStroke.length - 1];
                const [ex, ey] = strokeToCanvas(lastPt, w, h);
                drawMarker(ctx, ex, ey, '#dc3545', 'Fin');
            }

            debugInfo.textContent += ` | ${normStrokes.length} stroke(s), ${normStrokes.reduce((a,s) => a+s.length, 0)} pts`;
        }

        function drawMarker(ctx, x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = 'bold 11px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(label, x, y - 12);
        }

        // ── Animation stroke par stroke ──
        function animateTrajectory(strokes) {
            const canvas = trajectoryCanvas;
            const ctx    = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);
            animBtn.disabled = true;

            const normStrokes = normalizeStrokes(strokes);
            const palette = ['#1a2a6c', '#b21f1f', '#f0900a', '#28a745', '#9b27af', '#0097a7'];

            let s = 0, i = 0;

            function step() {
                if (s >= normStrokes.length) {
                    // Terminé — dessiner les marqueurs
                    drawTrajectory(strokes);
                    animBtn.disabled = false;
                    return;
                }
                const stroke = normStrokes[s];
                if (i === 0) {
                    ctx.beginPath();
                    const [sx, sy] = strokeToCanvas(stroke[0], w, h);
                    ctx.moveTo(sx, sy);
                }
                if (i < stroke.length - 1) {
                    const [ax, ay] = strokeToCanvas(stroke[i], w, h);
                    const [bx, by] = strokeToCanvas(stroke[i+1], w, h);
                    ctx.strokeStyle = palette[s % palette.length];
                    ctx.lineWidth   = 2.5;
                    ctx.lineJoin    = 'round';
                    ctx.lineCap     = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ax, ay);
                    ctx.lineTo(bx, by);
                    ctx.stroke();
                    i++;
                    requestAnimationFrame(step);
                } else {
                    s++;
                    i = 0;
                    // Petite pause entre les strokes
                    setTimeout(() => requestAnimationFrame(step), 80);
                }
            }
            requestAnimationFrame(step);
        }
    </script>
</body>
</html>
